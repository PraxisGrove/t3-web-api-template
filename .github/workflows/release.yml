name: Date Release

on:
  push:
    tags:
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]"
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2026.07.08"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "Invalid date release tag: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          release="${tag#v}"
          changelog_heading="$(echo "$release" | sed -E 's/^([0-9]{4})\.([0-9]{2})\.([0-9]{2})(\.[0-9]+)?$/\1-\2-\3\4/')"

          awk -v heading="## $changelog_heading" '
            $0 == heading { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No changelog section found for $changelog_heading." > RELEASE_NOTES.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.title }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true

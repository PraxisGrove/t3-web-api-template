name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: t3_web_api_template
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d t3_web_api_template"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/t3_web_api_template
      LOG_LEVEL: info
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: "0.1"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS: "1000"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      SENTRY_TRACES_SAMPLE_RATE: "0.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply committed migrations to an empty database
        run: pnpm db:migrate

      - name: Verify migrations can run again safely
        run: pnpm db:migrate

      - name: Check schema matches migrations
        run: pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Seed database
        run: pnpm db:seed

      - name: Verify
        run: pnpm verify

      - name: Smoke test the production server against Postgres
        run: |
          pnpm start > /tmp/t3-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/t3-smoke.log' EXIT
          node scripts/smoke-test.mjs http://127.0.0.1:3000

  docker:
    name: Docker template smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Build and start the template with an empty database
        run: docker compose -f docker-compose.app.yml up --build -d

      - name: Smoke test the container
        run: node scripts/smoke-test.mjs http://127.0.0.1:3000

      - name: Container logs
        if: always()
        run: docker compose -f docker-compose.app.yml logs --no-color

      - name: Clean up disposable containers and database
        if: always()
        run: docker compose -f docker-compose.app.yml down --volumes
